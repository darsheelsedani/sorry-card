<!DOCTYPE html>
<html>
<head>
    <title>I'm really Sorry DIYA 💔</title>
    <style>
        body {
            font-size: 18px;
            margin: 0;
            overflow: hidden;
            background: 
            linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
            url('Luffy.jpg') no-repeat center/cover;
            font-family: Arial;
        }

        /* Hearts animation */
        .heart {
            position: absolute;
            color: red;
            font-size: 20px;
            animation: fall 5s linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 🌸 Card */
        .card {
            width: 320px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border-radius: 20px;
            text-align: center;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* 🎨 Heading */
        h2 {
            font-size: 24px;
            background: linear-gradient(90deg, #ff4d4d, #ff9a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 📝 Text */
        p {
            color: #4a4a4a;
            font-weight: 500;
        }

        /* 🔘 Buttons */
        button {
            margin: 10px;
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        #yes {
            background: #ff4d4d;
            color: white;
        }

        #yes:hover {
            transform: scale(1.1);
        }

        #no {
            background: #666;
            color: white;
            position: relative;
        }

        /* 💬 Message */
        #message {
            margin-top: 10px;
            color: #7a1f3d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <h2>I'm really sorry DIYA 💔</h2>
        <p>Sorry yaar... I messed up 🥺</p>

        <p>Will you forgive me?</p>

        <button id="yes" onclick="typeMessage()">Yes ❤️</button>
        <button id="no" onmouseover="moveNo()">No 😢</button>

        <p id="message"></p>
    </div>
</div>

<script>
const text = "Thank you BBG💖✨";
let i = 0;

function typeMessage() {
    const msg = document.getElementById("message");
    msg.innerHTML = "";
    i = 0;

    let interval = setInterval(() => {
        if (i < text.length) {
            msg.innerHTML += text.charAt(i);
            i++;
        } else {
            clearInterval(interval);
        }
    }, 50);
}

function moveNo() {
    const btn = document.getElementById("no");
    btn.style.position = "absolute";
    btn.style.left = Math.random() * (window.innerWidth - 100) + "px";
    btn.style.top = Math.random() * (window.innerHeight - 50) + "px";
}

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
